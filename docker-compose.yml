# Image tags are pinned so a clone reproduces the stack that was tested.
# ':latest' previously meant the evaluator could get a different ChromaDB or
# Ollama build than the one this was verified against.
services:
  postgres:
    image: postgres:16.2-alpine
    container_name: lenny-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lenny}
      POSTGRES_USER: ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenny} -d ${POSTGRES_DB:-lenny}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lenny-network]
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: lenny-chromadb
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    healthcheck:
      # Probes v2: the v1 endpoint was removed and returns 404, so the old
      # check reported unhealthy while the service was serving fine. The image
      # ships no curl, wget or python, so this uses bash's /dev/tcp to make the
      # HTTP request directly.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [lenny-network]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.7
    container_name: lenny-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Bound memory on an 8 GB machine.
      #
      # NUM_PARALLEL matters most: Ollama allocates num_ctx for EVERY parallel
      # slot, and defaults to 4. With an 8192 context that reserves 32768
      # tokens of KV cache and pushed a 2 GB model to 7.8 GB resident. This is
      # a single-user local tool, so one slot is correct as well as cheaper.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
    healthcheck:
      # The image has no curl; ollama's own CLI is the reliable probe.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [lenny-network]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lenny}:${POSTGRES_PASSWORD:-lenny_dev_password}@postgres:5432/${POSTGRES_DB:-lenny}

      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-lenny_transcripts}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_CONTEXT_WINDOW: ${OLLAMA_CONTEXT_WINDOW:-8192}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-ollama}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

      INGEST_LIMIT: ${INGEST_LIMIT:-15}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-10}
      CONTEXT_MAX_TOKENS: ${CONTEXT_MAX_TOKENS:-4000}
      MIN_SIMILARITY_SCORE: ${MIN_SIMILARITY_SCORE:-0.25}
    volumes:
      # Live reload during development. Remove for an immutable deployment.
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [lenny-network]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lenny-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [lenny-network]
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  ollama_data:

networks:
  lenny-network:
    driver: bridge
